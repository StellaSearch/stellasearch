# fly.toml app configuration file generated for stellasearch on 2026-11-14T22:14:57-05:00
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'stellasearch'
primary_region = 'ewr'

[build]
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
